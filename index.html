/* Layout: a single open book on a quiet ground (ma). Asymmetric page margins carry vertical running heads (fukinsei);
   ink, paper and one vermilion seal are the whole palette (kanso). One translucent capsule holds every control.
   Pages re-flow to the reader's screen: two-page spread on wide screens, one tall page on phones and portrait tablets. */
:root{
  --ground:#e8e7e3;
  --paper:#f6f5f1;
  --sumi:#1b1b1d;
  --usuzumi:#6c6c72;
  --hairline:rgba(27,27,29,.16);
  --shu:#c2402c;
  --gutter:rgba(60,50,40,.10);
  --cloth:#1c1c1f;
  --cloth-ink:#ece8de;
  --glass:rgba(250,250,247,.74);
  --glass-line:rgba(27,27,29,.09);
  --glass-ink:#1b1b1d;
  --glass-muted:#6c6c72;
  --sheet:#fbfaf8;
  --tint:#1b1b1d;
  --on-tint:#f6f5f1;
  --scrim:rgba(18,18,20,.26);
  --page-shadow:0 1px 2px rgba(0,0,0,.06),0 20px 38px -26px rgba(0,0,0,.5);
  --font-display:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",Georgia,"Times New Roman",serif;
  --font-body:"Zen Kaku Gothic New","Hiragino Sans","Helvetica Neue",Arial,sans-serif;
  --font-data:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#111113; --paper:#ecebe6; --cloth:#202024; --gutter:rgba(40,32,24,.16);
    --glass:rgba(32,32,36,.74); --glass-line:rgba(255,255,255,.09); --glass-ink:#ececef; --glass-muted:#9d9da6;
    --sheet:#1c1c20; --tint:#ececef; --on-tint:#111113; --scrim:rgba(0,0,0,.5);
    --page-shadow:0 1px 2px rgba(0,0,0,.5),0 26px 50px -24px rgba(0,0,0,.9);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#111113; --paper:#ecebe6; --cloth:#202024; --gutter:rgba(40,32,24,.16);
  --glass:rgba(32,32,36,.74); --glass-line:rgba(255,255,255,.09); --glass-ink:#ececef; --glass-muted:#9d9da6;
  --sheet:#1c1c20; --tint:#ececef; --on-tint:#111113; --scrim:rgba(0,0,0,.5);
  --page-shadow:0 1px 2px rgba(0,0,0,.5),0 26px 50px -24px rgba(0,0,0,.9);
  color-scheme:dark;
}
@media (prefers-reduced-transparency: reduce){ :root{ --glass:var(--sheet) } }

[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--glass-ink);font-family:var(--font-body);overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
.app{height:100%;display:flex;flex-direction:column;padding-inline:16px;box-sizing:border-box}
button{font:inherit;color:inherit;touch-action:manipulation}
:focus-visible{outline:2px solid var(--shu);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- stage & book ---------- */
.stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:pan-y;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.book{position:relative;width:calc(var(--pw,400px) * 2);height:var(--ph,590px);will-change:transform}
.book.single{width:var(--pw,400px)}
.slot{position:absolute;top:0;width:var(--pw,400px);height:100%}
.slot.left{left:0}
.slot.right{left:var(--pw,400px)}
.book.single .slot.right{left:0}
.book.single .slot.left{display:none}
.slot.measure{left:0;visibility:hidden;pointer-events:none;z-index:-1}
.slot.measure .pb{overflow:hidden!important}
.leaf{position:absolute;top:0;width:var(--pw,400px);height:100%;transform-style:preserve-3d;z-index:5;pointer-events:none;will-change:transform}
.leaf.fwd{left:var(--pw,400px);transform-origin:left center}
.leaf.bwd{left:0;transform-origin:right center}
.leaf.solo{left:0;transform-origin:left center}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.b{transform:rotateY(180deg)}
.face.blank{background:var(--paper)}
.shade{position:absolute;inset:0;opacity:0;pointer-events:none;background:linear-gradient(to right,rgba(0,0,0,.32),rgba(0,0,0,.04))}
.face.b .shade{background:linear-gradient(to left,rgba(0,0,0,.32),rgba(0,0,0,.04))}
.edge{position:absolute;top:0;height:100%;width:6%;border:0;padding:0;background:transparent;cursor:pointer;z-index:4;opacity:0;transition:opacity .25s}
.edge:hover,.edge:focus-visible{opacity:1}
.edge.prev{left:0;background:linear-gradient(to right,rgba(0,0,0,.08),transparent)}
.edge.next{right:0;background:linear-gradient(to left,rgba(0,0,0,.08),transparent)}

/* ---------- paper ---------- */
.page{position:absolute;inset:0;box-sizing:border-box;background-color:var(--paper);background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='f'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .4 0 0 0 0 .34 0 0 0 0 .26 .05 0 0 0 0'/></filter><rect width='100%' height='100%' filter='url(%23f)'/></svg>");color:var(--sumi);font-family:var(--font-body);font-size:var(--fs,14px);line-height:1.45;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--page-shadow)}
.page.left{padding:2.6em 2.2em 3.2em 3.6em}
.page.right{padding:2.6em 3.6em 3.2em 2.2em}
.page.single{padding:2.4em 2.9em 3em 1.8em}
.page::after{content:"";position:absolute;top:0;bottom:0;width:12%;pointer-events:none}
.page.left::after{right:0;background:linear-gradient(to right,transparent,var(--gutter))}
.page.right::after{left:0;background:linear-gradient(to left,transparent,var(--gutter))}
.slot.left .page{box-shadow:var(--page-shadow),-2px 0 0 #e3e1da,-3px 0 0 #d3d0c8}
.slot.right .page{box-shadow:var(--page-shadow),2px 0 0 #e3e1da,3px 0 0 #d3d0c8}
.slot .page.page--cover,.slot .page.page--back{box-shadow:var(--page-shadow),0 0 0 1px rgba(255,255,255,.05)}

.rhw{position:absolute;top:2.6em}
.page.left .rhw{left:1.35em}
.page.right .rhw{right:1.35em}
.page.single .rhw{right:1.2em;top:2.4em}
.rh{writing-mode:vertical-rl;font-size:.52em;letter-spacing:.34em;text-transform:uppercase;color:var(--usuzumi);white-space:nowrap}
.fo{position:absolute;bottom:1.5em;font-family:var(--font-display);font-size:.7em;color:var(--usuzumi);font-variant-numeric:tabular-nums}
.page.left .fo{left:calc(3.6em / .7)}
.page.right .fo{right:calc(3.6em / .7)}
.page.single .fo{right:calc(2.9em / .7)}
.pb{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:2.6em}
.page--contents .pb,.page--index .pb,.pb.prose{overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}
.pb::-webkit-scrollbar{display:none}

/* combinations: each takes an equal share of the page; swatches grow to fill it, within limits */
.page--combo .pb{gap:2.2em}
.combo{flex:1 1 0;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:.85em}
.combo__head,.labs{flex:none}
.combo__head{display:flex;align-items:baseline;justify-content:space-between;gap:1em}
.combo__no{font-family:var(--font-display);font-weight:500;font-size:1.2em;letter-spacing:.06em;font-variant-numeric:tabular-nums;line-height:1}
.copy{all:unset;box-sizing:border-box;cursor:pointer;font-size:.54em;letter-spacing:.2em;text-transform:uppercase;color:var(--usuzumi);padding:.7em 0 .7em .8em;display:inline-flex;align-items:center;gap:.7em}
.copy::before{content:"";width:1.4em;height:1px;background:currentColor;opacity:.6}
.copy:hover{color:var(--sumi)}
.copy:focus-visible{outline:2px solid var(--shu);outline-offset:2px}
.sws{display:grid;grid-template-columns:repeat(var(--n),1fr);flex:1 1 auto;min-height:4.5em;max-height:var(--swh,10em)}
.combo--2 .sws{--swh:11em}
.combo--3 .sws{--swh:9.5em}
.combo--4 .sws{--swh:24em}
.sw{all:unset;box-sizing:border-box;display:block;cursor:pointer;background:var(--c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.05);position:relative;transition:transform .12s ease-out}
.sw:active{transform:scale(.985)}
.sw:focus-visible{outline:2px solid var(--shu);outline-offset:2px;z-index:2}
.labs{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:.9em}
.lab{min-width:0}
.lab__name{display:block;font-size:.72em;font-weight:500;line-height:1.3}
.lab__cmyk{display:block;font-family:var(--font-data);font-size:.56em;color:var(--usuzumi);margin-top:.45em;letter-spacing:.02em}
.var{font-style:normal;font-family:var(--font-data);font-size:.8em;color:var(--usuzumi);margin-left:.35em}
.combo.flash .sws,.irow.flash{animation:flash 1.8s ease-out}
@keyframes flash{0%,35%{box-shadow:0 0 0 .55em var(--paper),0 0 0 .62em var(--shu)}100%{box-shadow:0 0 0 .55em transparent,0 0 0 .62em transparent}}

/* index */
.ihead{display:flex;align-items:baseline;justify-content:space-between;gap:1em;padding-bottom:.7em;border-bottom:1px solid var(--hairline);flex:none}
.ihead h2{margin:0;font-family:var(--font-display);font-weight:500;font-size:1.2em;line-height:1.2;text-wrap:balance}
.ihead span{font-family:var(--font-data);font-size:.56em;color:var(--usuzumi);white-space:nowrap}
.page--index .pb{justify-content:flex-start;gap:1.15em}
.irow{display:grid;grid-template-columns:3.6em 1fr;gap:1.1em;align-items:start;border-radius:.1em;flex:none}
.irow .sw{height:3em}
.irow__name{font-family:var(--font-display);font-weight:500;font-size:.88em;line-height:1.2}
.irow__meta{font-family:var(--font-data);font-size:.56em;color:var(--usuzumi);margin-top:.4em;letter-spacing:.02em}
.nums{display:flex;flex-wrap:wrap;gap:.2em .55em;margin-top:.45em}
.num{all:unset;box-sizing:border-box;cursor:pointer;font-family:var(--font-data);font-size:.6em;line-height:1;padding:.45em .1em;color:var(--sumi);border-bottom:1px solid transparent;font-variant-numeric:tabular-nums}
.num:hover{border-bottom-color:var(--sumi)}
.num:focus-visible{outline:2px solid var(--shu);outline-offset:1px}

/* cover & back: blind-stamped frame, quiet hierarchy, a signature seal */
.page--cover,.page--back{background-color:var(--cloth);color:var(--cloth-ink);background-image:radial-gradient(ellipse 90% 70% at 28% 18%,rgba(255,255,255,.055),transparent 62%),repeating-linear-gradient(0deg,rgba(255,255,255,.012) 0 1px,transparent 1px 3px),repeating-linear-gradient(90deg,rgba(0,0,0,.05) 0 1px,transparent 1px 3px);padding:3.4em 3em 3em 3.4em}
.page--cover::before,.page--back::before{content:"";position:absolute;inset:1.15em;border:1px solid rgba(255,255,255,.075);box-shadow:0 1px 0 rgba(0,0,0,.25),inset 0 1px 0 rgba(0,0,0,.25);pointer-events:none}
.page--cover::after,.page--back::after{width:5%}
.seal{display:inline-block;flex:none;width:1em;height:1em;background:var(--shu);border-radius:.08em;box-shadow:inset 0 0 0 .09em var(--shu),inset 0 0 0 .14em rgba(255,255,255,.5)}
.cv{flex:1;display:flex;flex-direction:column;position:relative}
.cv__top{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--font-data);font-size:.5em;letter-spacing:.32em;text-transform:uppercase;opacity:.55}
.cv__mid{margin-top:auto;margin-bottom:auto;padding-top:2.5em}
.cv__kicker{font-size:.56em;letter-spacing:.46em;text-transform:uppercase;opacity:.72;margin:0 0 1.3em}
.cv__title{margin:0;font-family:var(--font-display);font-weight:400;font-size:3em;line-height:1.04;letter-spacing:-.022em}
.cv__title span{display:block}
.cv__spectrum{display:flex;width:7.2em;height:.2em;margin-top:2.2em;opacity:.95}
.cv__spectrum i{flex:1}
.cv__foot{display:flex;justify-content:space-between;align-items:flex-end;gap:1em}
.cv__foot .seal{font-size:1.15em}
.cv__by{display:flex;align-items:center;gap:.7em;font-family:var(--font-display);font-size:1em;letter-spacing:.08em}
.cv__by .seal{font-size:.9em}
.cv__years{font-family:var(--font-data);font-size:.5em;letter-spacing:.24em;opacity:.55}
.bk{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.4em;text-align:center}
.bk .seal{font-size:1.3em}
.bk p{margin:0;font-family:var(--font-data);font-size:.5em;letter-spacing:.32em;text-transform:uppercase;opacity:.6}
.bk .bk__url{position:absolute;left:0;right:0;bottom:3.4em;font-size:.46em;letter-spacing:.08em;text-transform:none;opacity:.42}

/* front matter */
.page--mosaic .pb{justify-content:flex-start;gap:1.4em}
.mosaic{flex:1;min-height:0;display:grid;grid-template-columns:repeat(9,1fr);grid-template-rows:repeat(18,minmax(0,1fr));gap:.12em;max-height:31em}
.cap{font-size:.6em;color:var(--usuzumi);margin:0;line-height:1.6;max-width:26em;flex:none}
.tp{flex:1;display:flex;flex-direction:column;justify-content:center;padding-bottom:3em}
.tp__kicker{margin:0 0 1.2em;font-size:.52em;letter-spacing:.44em;text-transform:uppercase;color:var(--usuzumi)}
.tp__title{margin:0;font-family:var(--font-display);font-weight:400;font-size:2.4em;line-height:1.05;letter-spacing:-.02em}
.tp__title span{display:block}
.tp__rule{width:2.4em;height:1px;background:var(--sumi);opacity:.5;margin:2.4em 0 1.6em}
.tp__sub{margin:0;font-family:var(--font-display);font-size:.9em;line-height:1.55;max-width:17em}
.tp__meta{margin:.8em 0 0;font-family:var(--font-data);font-size:.52em;letter-spacing:.2em;text-transform:uppercase;color:var(--usuzumi)}
.tp__src{margin:3.4em 0 0;font-size:.66em;line-height:1.75;max-width:23em;color:var(--usuzumi)}
.prose{display:block;padding-top:1.2em}
.prose>:first-child{margin-top:0}
.prose h2{font-family:var(--font-display);font-weight:500;font-size:1.3em;line-height:1.25;margin:0 0 1em;text-wrap:balance}
.prose h3{font-size:.56em;font-weight:500;letter-spacing:.26em;text-transform:uppercase;color:var(--usuzumi);margin:2.3em 0 1em}
.prose p{font-size:.72em;line-height:1.75;margin:0 0 .9em;max-width:34em}
.prose a{color:inherit;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:.2em}
.prose strong{font-weight:500}
.prose ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:.5em}
.prose li{display:grid;grid-template-columns:5.4em 1fr;gap:.8em;font-size:.72em;line-height:1.5}
.prose li b{font-family:var(--font-data);font-weight:400;font-size:.9em;color:var(--usuzumi)}
.toc{display:flex;flex-direction:column;margin-block:auto}
.toc__item{all:unset;box-sizing:border-box;display:flex;align-items:baseline;gap:.7em;padding:.42em 0;cursor:pointer;font-size:.76em}
.toc__item:hover .toc__t{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:.25em}
.toc__item:focus-visible{outline:2px solid var(--shu);outline-offset:2px}
.toc__t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.toc__dots{flex:1;border-bottom:1px solid var(--hairline);transform:translateY(-.3em);min-width:1em}
.toc__p{font-family:var(--font-display);font-variant-numeric:tabular-nums}
.toc__item.major{font-family:var(--font-display);font-size:.94em;margin-top:.8em}
.toc__item.sub{padding-left:1.6em;font-size:.68em;color:var(--usuzumi)}
.toc__r{font-family:var(--font-data);font-size:.66em;color:var(--usuzumi)}

/* part openings */
.dv{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:1.1em;padding-bottom:2em}
.dv__num{font-family:var(--font-display);font-weight:400;font-size:.9em;letter-spacing:.3em;color:var(--usuzumi)}

/* ---------- control capsule ---------- */
.dock{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;grid-template-areas:"prev mid tools next";align-items:center;gap:6px 12px;width:min(900px,100%);box-sizing:border-box;margin:4px auto 14px;padding:7px;border-radius:26px;background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%);box-shadow:0 0 0 1px var(--glass-line),0 14px 34px -22px rgba(0,0,0,.5)}
.ib{width:40px;height:40px;border-radius:50%;border:0;background:var(--tint);color:var(--on-tint);display:grid;place-items:center;cursor:pointer;transition:transform .1s ease-out,opacity .2s;flex:none}
.ib svg{width:16px;height:16px}
.ib:active{transform:scale(.92)}
.ib:disabled{opacity:.18;cursor:default}
#prev{grid-area:prev}#next{grid-area:next}
.mid{grid-area:mid;min-width:0;display:flex;flex-direction:column;gap:5px;padding-inline:6px}
.meta{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:12px;line-height:1.2;white-space:nowrap;min-width:0}
.meta b{font-weight:500;font-variant-numeric:tabular-nums;flex:none}
.meta span{color:var(--glass-muted);overflow:hidden;text-overflow:ellipsis;min-width:0}
.scrub{-webkit-appearance:none;appearance:none;width:100%;height:18px;margin:0;background:transparent;cursor:pointer;--fill:0%;touch-action:pan-x}
.scrub::-webkit-slider-runnable-track{height:2px;border-radius:2px;background:linear-gradient(var(--tint),var(--tint)) 0/var(--fill) 100% no-repeat,var(--glass-line)}
.scrub::-moz-range-track{height:2px;border-radius:2px;background:linear-gradient(var(--tint),var(--tint)) 0/var(--fill) 100% no-repeat,var(--glass-line)}
.scrub::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--tint);margin-top:-5.5px;border:0;transition:transform .1s}
.scrub::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:var(--tint);border:0}
.scrub:active::-webkit-slider-thumb{transform:scale(1.35)}
.tools{grid-area:tools;display:flex;align-items:center;gap:2px}
.tb{height:36px;padding:0 12px;border-radius:18px;border:0;background:transparent;color:var(--glass-ink);display:inline-flex;align-items:center;justify-content:center;gap:7px;font-size:13px;cursor:pointer;white-space:nowrap;transition:transform .1s ease-out,background-color .15s}
.tb svg{width:15px;height:15px;opacity:.8;flex:none}
.tb:hover{background:var(--glass-line)}
.tb:active{transform:scale(.95)}
.tb--find{display:none}
.go{display:flex;align-items:center;margin-left:4px}
.go input{width:74px;height:36px;box-sizing:border-box;border:0;border-radius:18px;background:var(--glass-line);color:var(--glass-ink);font-family:var(--font-data);font-size:13px;text-align:center;padding:0 10px}
.go input::placeholder{color:var(--glass-muted)}
.go input[aria-invalid="true"],.find input[aria-invalid="true"]{box-shadow:inset 0 0 0 1.5px var(--shu)}
.find{position:absolute;inset:0;z-index:2;display:flex;align-items:center;gap:6px;padding:6px 6px 6px 18px;border-radius:inherit;background:var(--sheet);box-shadow:0 0 0 1px var(--glass-line)}
.find__lab{font-family:var(--font-display);font-size:15px;color:var(--glass-muted)}
.find input{flex:1;min-width:0;height:40px;border:0;background:transparent;color:var(--glass-ink);font-family:var(--font-data);font-size:16px;letter-spacing:.08em;padding:0 4px;outline:none}
.find input:focus-visible{outline:none}
.find__go{height:40px;padding:0 18px;border-radius:20px;border:0;background:var(--tint);color:var(--on-tint);font-size:14px;cursor:pointer}
.find__x{height:40px;padding:0 12px;border-radius:20px;border:0;background:transparent;color:var(--glass-muted);font-size:14px;cursor:pointer}
@media (max-width:620px){
  .dock{gap:4px;padding:6px;border-radius:24px;margin-bottom:10px}
  .tb span{display:none}
  .tb{width:40px;padding:0}
  .go{display:none}
  .tb--find{display:inline-flex}
  .mid{padding-inline:4px}
}
@media (max-width:420px){ .meta span{display:none} }
@media (max-width:340px){
  .dock{grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"prev mid next" "tools tools tools"}
  .tools{justify-content:center}
}
@media (pointer:coarse){
  .ib{width:44px;height:44px}
  .tb{height:44px;border-radius:22px;min-width:44px}
  .go input{height:44px;border-radius:22px;font-size:16px}
}

/* ---------- color sheet ---------- */
.sheet{position:fixed;inset:0;z-index:50}
.sheet__scrim{position:absolute;inset:0;background:var(--scrim);opacity:0}
.sheet__card{position:absolute;box-sizing:border-box;background:var(--sheet);color:var(--glass-ink);box-shadow:0 0 0 1px var(--glass-line),0 30px 70px -20px rgba(0,0,0,.55);overflow:auto;overscroll-behavior:contain;will-change:transform}
.sheet.side .sheet__card{top:14px;right:14px;bottom:14px;width:min(380px,calc(100% - 28px));border-radius:24px}
.sheet.bottom .sheet__card{left:0;right:0;bottom:0;max-height:90%;border-radius:24px 24px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
.grab{height:26px;display:grid;place-items:center;cursor:grab;touch-action:none}
.grab::before{content:"";width:38px;height:5px;border-radius:3px;background:var(--glass-muted);opacity:.45}
.sheet.side .grab{display:none}
.sheet__top{position:relative;padding:0 18px;touch-action:none}
.sheet.side .sheet__top{padding-top:18px}
.sheet__sw{height:168px;border-radius:6px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.sheet.bottom .sheet__sw{height:112px}
.sheet__x{position:absolute;top:10px;right:28px;width:32px;height:32px;border-radius:50%;border:0;background:rgba(255,255,255,.82);color:#1b1b1d;display:grid;place-items:center;cursor:pointer;transition:transform .1s}
.sheet.side .sheet__x{top:28px}
.sheet__x:active{transform:scale(.92)}
.sheet__x svg{width:14px;height:14px}
.sheet__body{padding:20px 22px 24px;display:flex;flex-direction:column;gap:18px}
.sheet__eyebrow{margin:0 0 6px;font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--glass-muted)}
.sheet__name{margin:0;font-family:var(--font-display);font-weight:500;font-size:26px;line-height:1.15;letter-spacing:-.01em}
.vals{display:flex;flex-direction:column;border-top:1px solid var(--glass-line)}
.val{all:unset;box-sizing:border-box;display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:10px;min-height:46px;border-bottom:1px solid var(--glass-line);cursor:pointer;transition:background-color .15s}
.val:hover{background:var(--glass-line)}
.val:active{background:var(--glass-line)}
.val:focus-visible{outline:2px solid var(--shu);outline-offset:-2px}
.val__k{font-size:10.5px;letter-spacing:.2em;color:var(--glass-muted);padding-left:2px}
.val__v{font-family:var(--font-data);font-size:13.5px}
.val__c{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--glass-muted);padding-right:4px}
.used{margin:0;font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--glass-muted)}
.crows{display:flex;flex-direction:column;margin-top:-8px;border-top:1px solid var(--glass-line)}
.crow{all:unset;box-sizing:border-box;display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;align-items:center;padding:12px 6px 12px 2px;border-bottom:1px solid var(--glass-line);cursor:pointer;transition:background-color .15s,transform .1s}
.crow:hover{background:var(--glass-line)}
.crow:active{transform:scale(.985)}
.crow:focus-visible{outline:2px solid var(--shu);outline-offset:-2px}
.crow__no{font-family:var(--font-display);font-size:15px;font-variant-numeric:tabular-nums;letter-spacing:.04em;padding-left:4px}
.crow__body{min-width:0;display:flex;flex-direction:column;gap:7px}
.crow__strip{display:flex;height:34px;border-radius:3px;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.crow__strip i{flex:1;position:relative}
.crow__strip i.me::after{content:"";position:absolute;left:50%;bottom:6px;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--sheet);box-shadow:0 0 0 1px rgba(0,0,0,.18)}
.crow__with{font-size:11.5px;line-height:1.4;color:var(--glass-muted)}
.link{all:unset;box-sizing:border-box;cursor:pointer;font-size:13px;display:inline-flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--glass-ink);align-self:flex-start}
.link:focus-visible{outline:2px solid var(--shu);outline-offset:2px}

.toast{position:fixed;left:50%;bottom:calc(var(--dock-h,90px) + 26px);transform:translateX(-50%);z-index:60;max-width:calc(100% - 32px);box-sizing:border-box;background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%);color:var(--glass-ink);box-shadow:0 0 0 1px var(--glass-line),0 12px 30px -16px rgba(0,0,0,.5);font-size:13px;line-height:1.4;padding:10px 16px;border-radius:20px;user-select:text;-webkit-user-select:text;word-break:break-word;animation:toastIn .25s ease-out}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,6px)}to{opacity:1;transform:translate(-50%,0)}}

@media (prefers-reduced-motion: reduce){
  .sw,.edge,.ib,.tb,.crow{transition:none}
  .combo.flash .sws,.irow.flash,.toast{animation:none}
}

/* ---------- motion primitives (springs, projection, rubber-band) ---------- */
// Damping ratio + response, as in Apple's fluid-interface model; mass 1.
function spring({from, to, velocity = 0, damping = 1, response = .45, eps = .0005, onUpdate, onRest}) {
  const k = (2 * Math.PI / response) ** 2, c = 4 * Math.PI * damping / response;
  let x = from, v = velocity, last = null, raf = 0, live = true;
  const tick = now => {
    if (!live) return;
    if (last == null) last = now - 16;
    const dt = Math.min(.064, (now - last) / 1000); last = now;
    const n = Math.max(1, Math.ceil(dt / .004)), h = dt / n;
    for (let i = 0; i < n; i++) { v += (-k * (x - to) - c * v) * h; x += v * h; }
    if (Math.abs(x - to) < eps && Math.abs(v) < eps * 20) { x = to; v = 0; live = false; onUpdate(x); onRest && onRest(); return; }
    onUpdate(x); raf = requestAnimationFrame(tick);
  };
  raf = requestAnimationFrame(tick);
  return {stop() { live = false; cancelAnimationFrame(raf); }, get x() { return x; }, get v() { return v; }, to};
}
const project = (v, d = .998) => (v / 1000) * d / (1 - d);           // where a flick would come to rest
const rubber = (o, dim, c = .55) => (o * dim * c) / (dim + c * Math.abs(o));
function tracker() {
  const h = [];
  return {
    add(x, t) { h.push({x, t}); while (h.length > 2 && t - h[0].t > 90) h.shift(); },
    velocity() { if (h.length < 2) return 0; const a = h[0], b = h[h.length - 1]; return b.t > a.t ? (b.x - a.x) / (b.t - a.t) * 1000 : 0; }
  };
}
const reduced = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- pagination: re-flows to the screen, measured rather than guessed ---------- */
const PARTS = [
  {roman: 'I', title: 'Two Colors', from: 1, to: 120, blurb: 'Pairs of colors. The simplest combinations, and often the boldest.'},
  {roman: 'II', title: 'Three Colors', from: 121, to: 240, blurb: 'A third color shifts the balance between the other two.'},
  {roman: 'III', title: 'Four Colors', from: 241, to: 348, blurb: 'Fuller palettes, given a page each.'},
];
let PAGES = [], comboPage = {}, colorPage = {}, P = {}, N = 0, planSig = '';
function buildPages(plan) {
  PAGES = []; comboPage = {}; colorPage = {}; P = {};
  const add = (t, extra = {}) => PAGES.push({t, key: t, ...extra}) - 1;
  P.cover = add('cover'); P.mosaic = add('mosaic'); P.title = add('title');
  plan.prose.about.forEach((blocks, k) => { const i = add('about', {blocks, key: k ? 'about' + k : 'about'}); if (!k) P.about = i; });
  plan.toc.forEach((items, k) => { const i = add('contents', {items, key: k ? 'contents' + k : 'contents'}); if (!k) P.contents = i; });
  for (const part of PARTS) {
    part.page = add('divider', {part, key: 'part' + part.roman});
    const per = part.from > 240 ? 1 : plan.per;
    for (let n = part.from; n <= part.to; n += per) {
      const ns = [];
      for (let k = 0; k < per && n + k <= part.to; k++) { ns.push(n + k); comboPage[n + k] = PAGES.length; }
      add('combo', {part, ns});
    }
  }
  P.index = add('idivider');
  FAM.forEach((fam, fi) => {
    fam.page = PAGES.length;
    plan.breaks[fi].forEach((items, k) => { const idx = add('index', {fam: fi, items, first: k === 0}); items.forEach(i => (colorPage[i] = idx)); });
  });
  plan.prose.notes.forEach((blocks, k) => { const i = add('notes', {blocks, key: k ? 'notes' + k : 'notes'}); if (!k) P.notes = i; });
  plan.prose.colophon.forEach((blocks, k) => { const i = add('colophon', {blocks, key: k ? 'colophon' + k : 'colophon'}); if (!k) P.colophon = i; });
  if (PAGES.length % 2 === 0) add('blank');
  P.back = add('back');
  N = PAGES.length;
}
function anchorOf(idx) {
  const p = PAGES[idx];
  if (!p) return {key: 'cover'};
  if (p.t === 'combo') return {combo: p.ns[0]};
  if (p.t === 'index') return {color: p.items[0]};
  return {key: p.key};
}
function pageOf(a) {
  if (!a) return 0;
  if (a.combo) return comboPage[a.combo] ?? 0;
  if (a.color != null) return colorPage[a.color] ?? 0;
  const i = PAGES.findIndex(p => p.key === a.key);
  return i < 0 ? 0 : i;
}

  sh.size = bottom ? card.offsetHeight : card.offsetWidth + 14;
  if (!sh.open) { sh.pos = sh.size; sheetApply(); }
  sh.open = true;
  sheetTo(0, 0, 1, .36);
  $('#sheetClose').focus({preventScroll: true});
}
function closeSheet(velocity = 0) {
  if (!sh.open) return;
  sh.open = false;
  sheetTo(sh.size, velocity, 1, .32, () => { if (!sh.open) { sheet.hidden = true; if (lastFocus && document.contains(lastFocus)) lastFocus.focus({preventScroll: true}); } });
}
scrim.addEventListener('click', () => closeSheet());
$('#sheetClose').addEventListener('click', () => closeSheet());
sheet.addEventListener('click', e => {
  const chip = e.target.closest('[data-chip]');
  if (chip) { closeSheet(); gotoCombo(+chip.dataset.chip); return; }
  const cv = e.target.closest('[data-copyval]');
  if (cv) copyText(cv.dataset.copyval, cv);
});
$('#sheetIndex').addEventListener('click', () => { closeSheet(); gotoColor(sheetColor); });
let sdrag = null;
function sheetDown(e) {
  if (e.button !== 0 || e.target.closest('#sheetClose')) return;
  if (sh.ctrl) sh.ctrl.stop();                                  // grab it even while it is moving
  sdrag = {id: e.pointerId, start: (sh.axis === 'y' ? e.clientY : e.clientX) - sh.pos, tr: tracker()};
  e.currentTarget.setPointerCapture(e.pointerId);
}
function sheetMove(e) {
  if (!sdrag || e.pointerId !== sdrag.id) return;
  const at = sh.axis === 'y' ? e.clientY : e.clientX;
  sdrag.tr.add(at, e.timeStamp);
  const raw = at - sdrag.start;
  sh.pos = raw < 0 ? -rubber(-raw, sh.size) : raw;
  sheetApply();
}
function sheetUp(e) {
  if (!sdrag || e.pointerId !== sdrag.id) return;
  const v = sdrag.tr.velocity(); sdrag = null;
  if (sh.pos + project(v) > sh.size * .45) closeSheet(v);
  else sheetTo(0, v, .82, .3);
}
['grab', 'sheetTop'].forEach(id => {
  const el = document.getElementById(id);
  el.addEventListener('pointerdown', sheetDown);
  el.addEventListener('pointermove', sheetMove);
  el.addEventListener('pointerup', sheetUp);
  el.addEventListener('pointercancel', sheetUp);
});
sheet.addEventListener('keydown', e => {
  if (e.key !== 'Tab') return;
  const f = [...sheet.querySelectorAll('button')].filter(b => b.offsetParent !== null);
  if (!f.length) return;
  if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
  else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
});

/* ---------- sizing & re-flow ---------- */
// Measure real row heights on a hidden page of the current size, then decide page breaks.
function measurePlan() {
  const side = mode === 'spread' ? 'right' : 'single';
  const m = document.createElement('div');
  m.className = 'slot measure';
  m.innerHTML = `<div class="page page--index ${side}"><div class="pb"><div class="ihead"><h2>Reds &amp; Red-Purples</h2><span>38 colors</span></div>${C.map((c, i) => irowHTML(i)).join('')}</div></div>`;
  book.appendChild(m);
  const pg = m.firstChild, pb = pg.querySelector('.pb'), cs = getComputedStyle(pb);
  const gap = parseFloat(cs.rowGap) || 0, fs = parseFloat(getComputedStyle(pg).fontSize);
  const avail = pb.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  const head = pg.querySelector('.ihead').getBoundingClientRect().height;
  const rows = [...pb.querySelectorAll('.irow')].map(r => r.getBoundingClientRect().height);
  m.remove();
  const breaks = FAM.map(f => {
    const out = []; let items = [], used = head;
    for (let i = f.from; i <= f.to; i++) {
      let add = (used > 0 ? gap : 0) + rows[i];
      if (used + add > avail - 2 && items.length) { out.push(items); items = []; used = 0; add = rows[i]; }
      items.push(i); used += add;
    }
    out.push(items);
    return out;
  });
  const prose = {};
  for (const key of Object.keys(PROSE)) {
    const pm = document.createElement('div');
    pm.className = 'slot measure';
    pm.innerHTML = `<div class="page page--${key} ${side}"><div class="pb prose"></div></div>`;
    book.appendChild(pm);
    const box = pm.querySelector('.pb'), pages = [];
    let group = [];
    PROSE[key].blocks.forEach((b, bi) => {
      box.innerHTML = [...group, bi].map(x => PROSE[key].blocks[x]).join('');
      if (box.scrollHeight > box.clientHeight + 1 && group.length) { pages.push(group); group = [bi]; }
      else group.push(bi);
    });
    pages.push(group);
    pm.remove();
    prose[key] = pages;
  }
  const tm = document.createElement('div');
  tm.className = 'slot measure';
  tm.innerHTML = `<div class="page page--contents ${side}"><div class="pb"><div class="toc"></div></div></div>`;
  book.appendChild(tm);
  const tbox = tm.querySelector('.pb'), tlist = tm.querySelector('.toc'), items = tocList(() => 888), toc = [];
  let tg = [];
  items.forEach((it, ii) => {
    tlist.innerHTML = [...tg, ii].map(x => tocItem(...items[x])).join('');
    if (tbox.scrollHeight > tbox.clientHeight + 1 && tg.length) { toc.push(tg); tg = [ii]; }
    else tg.push(ii);
  });
  toc.push(tg);
  tm.remove();
  return {per: avail / fs >= 27 ? 2 : 1, breaks, prose, toc};
}
let lastKey = '', pendingAnchor = null;
function layout(force) {
  const ae = document.activeElement;
  if (ae && ae.matches && ae.matches('#goNo,#findNo')) return;   // the on-screen keyboard resizes the page; wait until it closes
  const W = stage.clientWidth, Hs = stage.clientHeight;
  if (!W || !Hs) return;
  let m, npw, nph, nfs;
  const spreadW = Math.min(Hs * .93 * .68, (W - 12) / 2);
  if (W >= Hs && spreadW >= 300) {
    m = 'spread'; npw = Math.floor(spreadW); nph = Math.floor(npw / .68); nfs = npw / 28;
  } else if (W >= Hs * 1.5 && (W - 12) / 2 >= 220) {          // short landscape screens: two wide pages
    m = 'spread'; nph = Math.floor(Hs * .96); npw = Math.floor(Math.min((W - 12) / 2, nph));
    nfs = clamp(Math.min(npw / 24, nph / 34), 12, 18);
  } else {
    m = 'single';
    const H = Hs * .96;
    nph = H; npw = Math.min(W, H * (W > Hs ? 1 : .75));
    if (npw / nph < .52) nph = npw / .52;
    npw = Math.floor(npw); nph = Math.floor(nph);
    nfs = clamp(Math.min(npw / 24, nph / 34), 12, 18);
  }
  const key = `${m}|${npw}|${nph}|${nfs.toFixed(2)}`;
  if (key === lastKey && !force) return;
  lastKey = key;
  settleTurn();
  const anchor = pendingAnchor || (focus && focus.combo ? {combo: focus.combo} : focus && focus.color != null ? {color: focus.color} : (N ? anchorOf(visible()[0]) : null));
  const keep = pendingAnchor ? (pendingAnchor.combo || pendingAnchor.color != null ? pendingAnchor : null) : focus;
  pendingAnchor = null;
  mode = m; pw = npw;
  book.style.setProperty('--pw', npw + 'px');
  book.style.setProperty('--ph', nph + 'px');
  book.style.setProperty('--fs', nfs.toFixed(3) + 'px');
  book.classList.toggle('single', m === 'single');
  const plan = measurePlan(), sig = JSON.stringify(plan);
  if (sig !== planSig) { planSig = sig; buildPages(plan); scrub.max = N - 1; }
  if (anchor) cur = clamp(anchor.page != null ? anchor.page : pageOf(anchor), 0, N - 1);
  focus = keep && (keep.combo || keep.color != null) ? {page: pageOf(keep), combo: keep.combo, color: keep.color} : null;
  render();
}

/* ---------- start ---------- */
function parseHash(h) {
  if (/^c\d+$/.test(h) && +h.slice(1) >= 1 && +h.slice(1) <= 348) return {combo: +h.slice(1)};
  if (/^k\d+$/.test(h) && +h.slice(1) >= 1 && +h.slice(1) <= C.length) return {color: +h.slice(1) - 1};
  if (/^p\d+$/.test(h)) return {page: +h.slice(1)};
  if (h === 'index') return {key: 'idivider'};
  if (/^[a-z]+[IV]*\d*$/.test(h)) return {key: h};
  return null;
}
addEventListener('hashchange', () => {          // a link or an edited address moves the book
  const a = parseHash(location.hash.slice(1));
  if (!a) return;
  if (a.combo) gotoCombo(a.combo);
  else if (a.color != null) gotoColor(a.color);
  else goTo(a.page != null ? a.page : pageOf(a));
});
(function start() {
  const a = parseHash((location.hash || '').slice(1));
  if (a) {
    pendingAnchor = a;
    if (a.combo) pendingFlash = `[data-n="${a.combo}"]`;
    if (a.color != null) pendingFlash = `[data-row="${a.color}"]`;
  } else { try { const s = JSON.parse(localStorage.getItem('adcc-anchor') || 'null'); if (s && typeof s === 'object') pendingAnchor = s; } catch (e) {} }
  if (!pendingAnchor) pendingAnchor = {key: 'cover'};
  layout(true);
  const dock = $('#dock');
  const setDockH = () => document.documentElement.style.setProperty('--dock-h', dock.offsetHeight + 'px');
  setDockH();
  if ('ResizeObserver' in window) { new ResizeObserver(() => layout()).observe(stage); new ResizeObserver(setDockH).observe(dock); }
  else window.addEventListener('resize', () => { layout(); setDockH(); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => layout(true));
})();
</script>
